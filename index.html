<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>으뜸안전기술 검색 노출</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<style>
:root{--navy:#0A1A44;--blue:#1450C8;--white:#FFFFFF;--blue-on-navy:#7FA6F5;--sky:#E9F0FD;--ink:#121826;--sub:#5B6475;--line:#E3E8F0;--faint:#F4F6FA;--bad:#C8352B;--warn:#B7791F;--good:#059669}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--white);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.75;letter-spacing:-.01em;word-break:keep-all;font-variant-numeric:tabular-nums}
::selection{background:var(--sky);color:var(--navy)}
a{color:var(--blue);text-underline-offset:3px}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,tr.svc:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* 머리: 남색 면 + 끝선 */
.top{background:var(--navy);color:var(--white)}
.top-in{max-width:1140px;margin:0 auto;padding:40px 24px 40px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:56px;height:56px;flex:none}
.top .kick{color:var(--blue-on-navy)}.top .kick::before{background:var(--blue-on-navy)}
.top h1{margin:4px 0 0;font-size:36px;font-weight:800;line-height:1.2;letter-spacing:-.035em;color:var(--white)}
.top h1 em{font-style:normal;color:var(--blue-on-navy)}
.top .upd{font-size:13px;color:rgba(255,255,255,.7);text-align:right;line-height:1.6}
.top .upd b{color:var(--white);font-weight:700}
.endline{height:8px;background:linear-gradient(90deg,var(--blue) 0 60%,var(--blue-on-navy) 60% 90%,var(--white) 90% 100%)}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px 60px}
/* 꼬리표와 제목 */
.kick{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--blue);line-height:1.4}
.kick::before{content:"";width:16px;height:2px;background:var(--blue)}
section.blk{margin-top:60px}
h2{margin:8px 0 8px;font-size:28px;font-weight:800;line-height:1.28;letter-spacing:-.03em;color:var(--navy)}
.lead{margin:0 0 24px;color:var(--sub);font-size:15px;line-height:1.7}
/* 큰 숫자 */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
.num{padding:0}
.num .v{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--blue)}
.num .v small{font-size:21px;font-weight:700;color:var(--navy);letter-spacing:0;margin-left:4px}
.num .l{margin-top:8px;font-size:14.5px;color:var(--sub);line-height:1.5}
.num .c{margin-top:4px;font-size:14px;font-weight:700}
.basis{margin-top:16px;font-size:13px;color:var(--sub)}
.up{color:var(--good)}.down{color:var(--bad)}
/* 요약 상자 */
.summary{margin-top:24px;background:var(--sky);border-left:4px solid var(--blue);border-radius:6px;padding:16px 24px}
.summary ul{margin:0;padding:0;list-style:none}
.summary li{font-size:15px;line-height:1.7;color:var(--ink)}
.summary li b{font-weight:700;color:var(--navy)}
/* 할 일 */
ol.todo{list-style:none;margin:0;padding:0;border-top:1px solid var(--navy);counter-reset:t}
ol.todo>li{display:grid;grid-template-columns:40px 1fr;gap:16px;padding:24px 0;border-bottom:1px solid var(--line);counter-increment:t}
ol.todo>li::before{content:counter(t,decimal-leading-zero);font-size:21px;font-weight:800;color:var(--navy);line-height:1.3;letter-spacing:-.02em}
.tag{display:inline-block;font-size:12px;font-weight:700;line-height:1.4;border-radius:999px;padding:4px 12px;margin-right:8px;vertical-align:3px;background:var(--faint);color:var(--sub)}
.tag.fix{background:var(--sky);color:var(--blue)}
.tt{font-size:21px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.35}
.why{color:var(--sub);font-size:14.5px;margin-top:4px;line-height:1.6}
.why .st{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.good{background:var(--good)}.dot.go{background:var(--blue)}
dl.plan{display:grid;grid-template-columns:96px 1fr;gap:8px 16px;margin:16px 0 0;padding:16px 24px;background:var(--faint);border-radius:6px;font-size:14.5px;line-height:1.6;max-width:880px}
dl.plan dt{color:var(--sub);font-weight:700;font-size:13px;padding-top:2px}
dl.plan dd{margin:0;color:var(--ink)}
dl.plan dd b{font-weight:700;color:var(--navy)}
dl.plan .sub{display:block;color:var(--sub);font-size:13.5px}
dl.plan .sub2{color:var(--sub)}
dl.plan dd a.post{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
dl.plan dd a.post:hover{text-decoration-color:var(--blue)}
.acts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:16px}
.btn2{display:inline-flex;align-items:center;gap:6px;background:var(--sky);color:var(--blue);font-size:14px;font-weight:700;padding:8px 16px;border-radius:8px;text-decoration:none;transition:background-color .15s ease-out}
.btn2:hover{background:#dbe6fb}
.lnk{font-size:14px;color:var(--sub);text-decoration:none;display:inline-flex;align-items:center;gap:4px}.lnk:hover{color:var(--blue)}
a.addr{display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--sub);text-decoration:none}
a.addr:hover{color:var(--blue)}
.empty{padding:24px 0;color:var(--sub)}
/* 블로그 카드 */
.bsum{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.bs{border:1px solid var(--line);border-radius:14px;padding:24px}
.bn{font-size:21px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.35}
.bv{font-size:40px;font-weight:800;color:var(--blue);letter-spacing:-.04em;line-height:1;margin:16px 0 8px}
.bv small{font-size:16px;font-weight:700;color:var(--navy);letter-spacing:0;margin-left:4px}
.bs .sub{font-size:14px;color:var(--sub);line-height:1.6;margin-top:4px}
.bs .warnline{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink);margin-top:8px}
/* 표 */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;line-height:1.6}
th{background:var(--navy);color:var(--white);font-size:13px;font-weight:700;letter-spacing:.02em;text-align:center;padding:12px 16px;white-space:nowrap}
th:first-child{border-top-left-radius:8px}th:last-child{border-top-right-radius:8px}
th a{color:var(--white);text-decoration:none}th a:hover{color:var(--blue-on-navy)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:1px solid var(--navy)}
td:first-child{font-weight:700;color:var(--ink)}
td.num,th.num{text-align:right}th.num{text-align:center}
tr.svc{cursor:pointer;transition:background-color .15s ease-out}tr.svc:hover td{background:var(--faint)}
.chev{display:inline-block;width:20px;color:var(--sub);transition:transform .2s ease-out}
tr.svc.open .chev{transform:rotate(90deg)}
tr.det td{background:var(--faint);font-size:13.5px;padding:8px 16px;font-weight:400}
tr.det td.kwc{padding-left:44px}
.bar{display:inline-block;width:80px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-right:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy)}
.frac{color:var(--ink)}
.ai{font-size:14px;color:var(--sub)}.ai b{font-weight:700;color:var(--ink)}.ai b.one{color:var(--blue)}
.rk{font-weight:700;color:var(--ink)}.rk.one{color:var(--blue);font-weight:800}.none{color:var(--sub)}
.ch{color:var(--sub);font-size:13px;margin-left:6px}
.d{font-size:12px;font-weight:700;margin-left:6px}
.tier{display:inline-block;font-size:11px;font-weight:700;color:var(--sub);background:var(--white);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-right:8px;letter-spacing:.02em}
table.ba td.strong{font-weight:800;color:var(--blue)}
table.ba td.plan{text-decoration:underline;text-decoration-color:var(--navy);text-decoration-thickness:2px;text-underline-offset:5px}
/* 접힘 */
details.blk{margin-top:60px;border-top:1px solid var(--line);padding-top:24px}
details.blk>summary{cursor:pointer;list-style:none;font-size:23px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary::before{content:"\ea6e";font-family:remixicon;font-weight:400;font-size:20px;color:var(--sub);transition:transform .2s ease-out}
details.blk[open]>summary::before{transform:rotate(90deg)}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
select,input{font:inherit;font-size:14.5px;padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink)}
.scroll{max-height:640px;overflow:auto}
.scroll th{position:sticky;top:0;z-index:1}
/* 바닥글 */
.foot{margin-top:60px;border-top:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.foot b{color:var(--navy);font-weight:700}
.note{color:var(--sub);font-size:13px;line-height:1.7;margin-top:40px;max-width:880px}
@media (max-width:900px){.nums{grid-template-columns:1fr;gap:24px}.bsum{grid-template-columns:1fr}}
@media (max-width:720px){.top-in{padding:24px 16px}.top h1{font-size:28px}.brand img{width:40px;height:40px}.wrap{padding:0 16px 40px}h2{font-size:24px}.num .v{font-size:44px}ol.todo>li{grid-template-columns:28px 1fr;gap:12px}.tt{font-size:18px}dl.plan{grid-template-columns:1fr;padding:16px}dl.plan dt{margin-top:8px}.hide-s{display:none}td,th{padding:10px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

ol.todo>li>.acts{grid-column:2;margin-top:0}
dl.plan dd a.post+.sub{display:inline;margin-left:8px}

.bmeta{font-size:13px;color:var(--sub);margin-top:4px}
.brow{margin-top:16px}.bl{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.02em;margin-bottom:6px}
.chipx{display:inline-block;font-size:13px;font-weight:700;color:var(--navy);background:var(--faint);border-radius:999px;padding:4px 12px;margin:0 6px 6px 0}
.chipx.exp{background:var(--sky);color:var(--blue)}.chipx b{font-weight:800}

컨설팅","한국안전컨설팅","다산컨설턴트 (안전진단/컨설팅 부문)","유신 / 도화엔지니어링 (안전진단실)","지역 기반 안전진단기관"],"ex":"","ans":"산업안전보건법 제67조에 따른 안전보건대장(기본·설계·공사) 작성 및 적정성 확인은 법적 요건(공사금액 50억 원 이상 등)과 전문가 자격(건설안전기술사, 산업안전지도사 등)이 엄격히 요구되는 분야입니다.\n\n특정 업체 한 곳을 단정하기보다, 공사의 규모와 성격에 따라 신뢰할 수 있는 주요 대행 기관 유형 및 대표 업체, 그리고 업체 선정 시 필수 확인사항을 정리해 드립니다.\n\n1. 주요 대행 기관 및 업체 유형\n\n업체의 규모와 전문 분야에 따라 크게 세 가지 그룹으로 나눌 수 있습니다.\n\n구분\t대표 기관 및 업체 (예시)\t특징 및 추천 대상\n\n\n비영리 공익법인\n\n\n\n\n(공신력 최우선)\n\n\t\n\n• 대한산업안전협회 (전국 지회 보유)\n\n\n\n\n• 한국건설안전협회\n\n\n\n\n• 안전보건진흥원\n\n\t\n\n• 국내 최고 수준의 공신력과 전국 단위 네트워크 보유\n\n\n\n\n• 공공기관 발주 공사, 대형 프로젝트에 가장 무난함\n\n\n\n\n• 표준화된 매뉴얼과 안정적인 적정성 검토 진행\n\n\n\n\n대형 건설안전 컨설팅\n\n\n\n\n(전문성·맞춤형 대응)\n\n\t\n\n• 한국안전컨설팅\n\n\n\n\n• 세이프티코리아\n\n\n\n\n• 다산컨설턴트 (안전진단/컨설팅 부문)\n\n\n\n\n• 유신 / 도화엔지니어링 (안전진단실)\n\n\t\n\n• 기술사 및 지도사 인력을 다수 보유한 민간 전문기관\n\n\n\n\n• 토목·플랜트·특수구조물 등 고난도 공정의 설계안전성검토(DFS) 및 안전보건대장 연계 작성에 강점\n\n\n\n\n지역 기반 안전진단기관\n\n\n\n\n(기동성·합리적 비용)\n\n\t\n\n• 고용노동부 지정 건설재해예방전문지도기관\n\n\n\n\n• 각 지역 안전기술원 / 안전진단법인\n\n\t\n\n• 현장 접근성이 뛰어나며 일정 조율이 유연함\n\n\n\n\n• 중·소규모(50억~300억 원대) 민간 건축공사에 적합\n\n\n\n\n• 견적 경쟁력이 상대적으로 우수함\n\n2. 업체 선정 시 필수 확인 체크리스트\n\n견적을 의뢰하기 전 아래 3가지 법적·실무적 요건을 반드시 확인해야 합니다.\n\n적정성 확인 전문가 자격 보유 여부 (가장 중요)\n\n설계·공사안전보건대장의 '적정성 확인'은 아무나 할 수 없으며, 법령에서 정한 건설안전분야 전문가(건설안전기술사, 건설안전분야 산업안전지도사, 건설안전기사 자격 취득 후 실무경력 충족자 등)가 직접 수행해야 합니다.\n\n계약 전, 실제 검토를 수행하고 날인할 담당자의 자격증 사본과 경력증명서 제출이 가능한지 확인하세요.\n\n작성 주체와 적정성 확인 주체의 분리\n\n발주자가 안전보건대장을 직접 작성하기 어려워 컨설팅 업체에 작성을 위탁할 경우, '작성 대행 업체'와 '적정성 확인 업체'는 원칙적으로 분리(또는 내부 독립성 확보)되어야 법적 리스크(형식적 검토 지적 등)를 피할 수 있습니다.\n\n한 업체에 일괄 의뢰할 경우, 해당 기관 내에 작성팀과 적정성 검토팀이 별도로 운영되는지 확인하시기 바랍니다.\n\n유사 공종 수행 실적 및 DFS 연계 능력\n\n현장이 일반 건축물인지, 토목(터널·교량)인지, 플랜트인지에 따라 유해·위험요인 도출의 질이 달라집니다.\n\n국토교통부 소관 설계안전성검토(DFS) 대상 현장이라면, 두 제도의 서류를 일관성 있게 통합 관리해 줄 수 있는 업체를 선택하는 것이 업무 효율 면에서 유리합니다.\n\n3. 진행 추천 절차\n\n현장 정보 정리: 총공사금액, 공사 종류(건축/토목 등), 현재 단계(기본계획 / 설계 / 착공 전), 현장 위치 정리\n\n비교 견적 요청: 위 표의 공익법인(대한산업안전협회 등) 1곳 + 민간 전문컨설팅 업체 2곳 정도에 과업지시서(또는 공사개요서)를 보내 견적과 수행계획서를 비교\n\n고용노동부 지정기관 조회: 고용노동부 홈페이지(정책자료 → 안전보건 강릉·양양 등 강원권\n춘천·원주까지 강원 전역\n전국 단위 우수 전문업체\n이 조건으로 업체 더 찾아보기\n\n목적을 알면 단순 구조기술사사무소와 실제 안전진단전문기관을 구분해서 더 정확하게 추천해 줄게.\n\nChatGPT는 실수할 수 있습니다. 중요한 정보는 확인하세요.\n최신 응답\n\n웹 검색 \n\nThink","prevPos":null},"gemini":{"d":"2026-11-13","m":false,"c":false,"pos":null,"of":6,"model":"flash","co":["(주)한국구조물안전연구원","(주)서영엔지니어링","(주)세이프티구조엔지니어링 (경기/수도권)","(주)대한구조안전진단 (수도권)","(주)한국건축구조기술사회 소속 건축구조기술사사무소","한국건축구조기술사회 활용"],"ex":"","ans":"건물 구조진단(안전점검 및 정밀안전진단) 업체를 선정할 때는 건물의 규모와 용도에 따라 국토교통부에 등록된 '안전진단전문기관'인지 확인하는 것이 가장 중요합니다.\n\n국내에서 인지도가 높고 실적이 검증된 주요 업체들과 지역별(안양·경기권 및 수도권) 업체 찾는 방법을 정리해 드립니다.\n\n1. 국내 대표 대형 안전진단전문기관 (전국 단위)\n\n대형 건축물, 공동주택(아파트), 공공시설물 등의 정밀안전진단 및 내진성능평가 실적이 풍부한 곳들입니다.\n\n한국시설안전협회 회원사 중 주요 기관\n\n(주)한국구조물안전연구원: 건축 및 토목 분야 정밀안전진단, 내진성능평가 분야에서 오랜 업력과 높은 인지도를 보유한 대표 기관입니다.\n\n(주)유신 / (주)도화엔지니어링 / (주)삼안: 국내 최상위권 종합 엔지니어링사로, 대규모 건축물 및 특수 구조물 진단 부서를 별도로 운영하며 기술력이 매우 뛰어납니다.\n\n(주)서영엔지니어링: 교량·터널 등 토목뿐만 아니라 대형 건축물의 안전진단 및 유지관리 분야에서 탄탄한 실적을 갖추고 있습니다.\n\n(주)마이다스아이티(MIDAS IT) 계열 및 협력 진단사: 구조해석 소프트웨어 분야에서 독보적인 기술력을 바탕으로 고난도 구조 검토 및 진단을 수행합니다.\n\n2. 중소형 건물·리모델링·누수/균열 특화 업체 (수도권·경기권)\n\n상가, 빌라, 단독주택, 소규모 공장 등의 균열 원인 규명, 리모델링 전 구조검토, 법적 정기점검이 목적이라면 기동성과 가성비가 좋은 전문업체를 추천합니다.\n\n(주)세이프티구조엔지니어링 (경기/수도권): 건축물 정밀안전점검, 리모델링 구조안전진단, 하자 소송 관련 감정 등을 전문으로 합니다.\n\n(주)대한구조안전진단 (수도권): 소규모 건축물 정기점검, 내진보강 설계 및 시공 연계가 원활한 곳입니다.\n\n(주)한국건축구조기술사회 소속 건축구조기술사사무소: 리모델링이나 증축, 내력벽 철거 등을 위한 '구조안전확인서' 발급이 목적이라면 안전진단전문기관보다 건축구조기술사사무소에 직접 의뢰하는 것이 훨씬 빠르고 비용도 합리적입니다.\n\n3. 내 조건에 맞는 정식 등록업체 직접 조회하는 법\n\n허가받지 않은 무자격 업체에 맡기면 법적 효력이 인정되지 않으므로, 반드시 공식 시스템을 통해 등록 여부를 확인해야 합니다.\n\n시설물통합정보관리시스템(FMS) 활용: 국토안전관리원에서 운영하는 사이트에 접속하면 지역별(예: 경기도 안양시)로 정식 등록된 안전진단전문기관 명단, 등록 분야(건축/토목), 행정처분 이력을 모두 투명하게 조회할 수 있습니다.\n\n한국건축구조기술사회 활용: 단순 균열 진단이나 리모델링 구조 검토가 목적이라면 해당 협회 홈페이지에서 지역별 정회원 사무소를 검색해 견적을 받아보시는 것이 좋습니다.\n\n업체 선정 시 체크리스트\n\n견적 비교는 최소 3곳: 진단 비용은 건물의 연면적, 준공 연도, 도면 보유 여부에 따라 천차만별입니다. 도면(건축·구조도면)을 미리 확보해 두면 현장 실측 비용을 크게 아낄 수 있습니다.\n\n장비 보유 현황: 단순 육안 점검이 아니라 초음파 측정기, 철근탐사기, 슈미트해머(강도 측정) 등 비파괴 검사 장비를 직접 보유하고 보고서에 정밀 데이터를 수록해 주는지
